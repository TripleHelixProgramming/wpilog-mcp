name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      # Let every OS finish, so one OS failing does not cancel (and hide) another's result
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew test shadowJar

      # The console names a failing test but not its assertion message; the report has both
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests/test
          retention-days: 14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm test compiles the extension, then runs its tests
      - name: Build and test VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm test

      - name: Upload shadow JAR
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: wpilog-mcp-jar
          path: build/libs/wpilog-mcp-*-all.jar
          retention-days: 14
