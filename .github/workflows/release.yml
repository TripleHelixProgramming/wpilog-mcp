name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The server JAR and the extension carry one version, build.gradle's: syncExtensionVersion
      # writes it into the extension's package.json before vsce packages it
      - name: Build shadow JAR and set the extension's version
        run: ./gradlew shadowJar syncExtensionVersion

      # A tag that disagrees with build.gradle would publish files under another version
      - name: Check the tag matches the project version
        run: |
          if [ ! -f "build/libs/wpilog-mcp-${GITHUB_REF_NAME#v}-all.jar" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version in build.gradle (built: $(ls build/libs/*-all.jar))"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bundle JAR into extension
        run: |
          cp build/libs/wpilog-mcp-*-all.jar vscode-extension/server/wpilog-mcp-all.jar

      # The extension lives in a subdirectory, so vsce must be told where relative
      # README links/images resolve (it otherwise assumes the repo root). The URLs
      # are pinned to the release tag so each published version's README keeps
      # working even if docs move later. Keep in sync with the buildExtension task
      # in build.gradle (which uses HEAD for local builds).
      - name: Build VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies \
            --baseContentUrl "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/vscode-extension" \
            --baseImagesUrl "${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/vscode-extension"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The release notes are the annotated tag's message (git tag -a), after its first line.
      # The checkout action stores the tag as a lightweight one, so the tag object is fetched
      # again. A lightweight tag has no message, and the release then carries only the
      # generated list of pull requests.
      - name: Read the release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      # A tag with a suffix (v0.9.0-dev, v1.0.0-rc1) is a test build, shown as a pre-release.
      # The repository's releases are immutable: nothing can be attached once a release is
      # published. The action publishes a pre-release before uploading, so the release is
      # created as a draft, the files are attached, and the next step publishes it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: ${{ runner.temp }}/release-notes.md
          append_body: true
          generate_release_notes: true
          files: |
            build/libs/wpilog-mcp-${{ steps.version.outputs.version }}-all.jar
            vscode-extension/*.vsix

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${{ github.repository }}"
