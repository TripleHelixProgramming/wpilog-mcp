# Each file mounted from this folder carries z: on a host with SELinux enforcing, such as Fedora,
# Docker relabels it so the container can read it; elsewhere z changes nothing.
services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # The recorded dashboard reads the server's CSV through Infinity, pinned like the images
      # and installed before Grafana starts, so provisioning finds it.
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@4.1.1
    ports: ["127.0.0.1:3000:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro,z
      - ./pit-dashboard.json:/etc/grafana/dashboards/pit-dashboard.json:ro,z
      - ./pit-recording-dashboard.json:/etc/grafana/dashboards/pit-recording-dashboard.json:ro,z
      - ./pit-history-dashboard.json:/etc/grafana/dashboards/pit-history-dashboard.json:ro,z
      - grafana-data:/var/lib/grafana
volumes:
  prometheus-data:
  grafana-data:
